<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bài 1 html</title>
    </head>
    <body>
        Môn phát triển ứng dụng web + BTL
        <!-- để chú thích dùng 2 cách -->
        <!-- Cách 1: ctrl + k + c -->
        <!-- Cách 2: ctrl + / -->
        <!-- Đây là chú thích -->
        <p>Thẻ p là thẻ phân đoạn</p>

        <!-- Thẻ h là thẻ định dạng đề mục -->
        <h1>Thẻ H1</h1>
        <h2>Thẻ H2</h2>
        <h3>Thẻ H3</h3>

        <!-- Thẻ br để xuống dòng -->
        <p>Môn web <br> Nhóm 03</p>

        <!-- Thẻ div và span để phân chia đoạn -->
        <div>Đây là thẻ div</div>
        <span>Đây là thẻ span</span>

        Thẻ b: in đậm
        Thẻ i, em: in nghiêng
        Thẻ u: gạch chân
        <b>Thẻ b</b>
        <i>Thẻ i</i>
        <em>Thẻ em</em>
        <u>Thẻ u</u>

        <div>
            <font face="verdana">Môn Phát triển Ứng dụng web</font>
            <font color="blue">Nhóm 3</font>
            <font size="7" face="verdana" color="blue">Tiết 1 2</font>
        </div>
    </body>
</html>
