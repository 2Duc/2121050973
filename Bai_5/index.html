<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5</title>
    <style>
        /* Internal style */
        h2 {
            /* color dùng để qui định màu chữ */
            color: red;
        }
    </style> 
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <!-- I. Các kiểu viết style -->
    <!-- Kiểu 1 viết style trong thẻ -->
    <!-- Loại 1: Inline style -->
    <h1 style="color: blue;">HUMG</h1>

    <!-- Kiểu 2 Viết ngoài thẻ -->
    <h2>Trường Đại học Mỏ - Địa chất</h2>

    <h3>Lớp phát triển ứng dụng web 03</h3>

    <!-- II. selector -->
    <!-- Cách 1: dùng tên thẻ -->

    <!-- Cách 2: dùng id -->
    <h2 id="tieuDe">Trường đại học mỏ địa chất</h2>

    <!-- Cách 3: dùng class (viết dấu . trước tên class) -->
    <h2 id="tieuDe" class="tieuDe">Trường đại học mỏ địa chất</h2>

    <!-- Cách 4:  -->
    <h3 class="tieuDe2">Lớp phát triển ứng dụng web 03</h3>
</body>
</html>
