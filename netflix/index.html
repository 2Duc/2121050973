      <div class="banner" onclick="xemTrailer()">
        <img class="banner-anh" src="./assets/banner.jpg" alt="" />
      </div>
      <div class="banner" style="display: none">
        <iframe
          class="banner-anh"
          src="https://www.youtube.com/embed/vGvCnjY_4Tc?si=f1wDQeMXsUGVcwdC"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>

                <img
                  class="phim-poster"
                  onclick="doiBanner('./assets/zootopia.jpg')"

                />
