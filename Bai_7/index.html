<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <!-- Internal JavaScript -->
    <script type="text/javascript">
      // in ra màn hình
      document.writeln("Hello World <br>");

      // Khai báo biến
      var ten = "Duc <br>";
      document.writeln(ten);

      ten = "Thanh <br>";
      document.writeln(ten);

      var namNay = 2026;
      document.writeln(namNay);

      // Phép toán
      var soThuNhat = 10;
      var soThuHai = 5;

      // cong +
      document.write("<br> Kết quả soThu1 + soThu2 là: ");
      ketQua = soThuNhat + soThuHai;
      document.write(ketQua);

      // tru -
      document.write("<br> Kết quả soThu1 - soThu2 là: ");
      ketQua = soThuNhat - soThuHai;
      document.write(ketQua);

      // nhan *
      document.write("<br> Kết quả soThu1 * soThu2 là: ");
      ketQua = soThuNhat * soThuHai;
      document.write(ketQua);

      // chia /
      document.write("<br> Kết quả soThu1 / soThu2 là: ");
      ketQua = soThuNhat / soThuHai;
      document.write(ketQua);

      // chia lấy dư %
      document.write("<br> Kết quả soThu1 % soThu2 là: ");
      ketQua = soThuNhat % soThuHai;
      document.write(ketQua);

      // ++
      document.write("<br>");
      document.writeln(soThuNhat++);
      document.write("<br>");
      document.writeln(soThuNhat);
      document.write("<br>");
      document.writeln(++soThuNhat);

      // --
      document.write("<br>");
      document.writeln(soThuNhat--);
      document.write("<br>");
      document.writeln(soThuNhat);
      document.write("<br>");
      document.writeln(--soThuNhat);

      // +=
      document.write("<br>");
      soThuNhat += soThuHai;
      document.write(soThuNhat);

      // -=
      document.write("<br>");
      soThuNhat -= soThuHai;
      document.write(soThuNhat);

      // *=
      document.write("<br>");
      soThuNhat *= soThuHai;
      document.write(soThuNhat);

      document.write("<br>");
      var ho = "Duong";
      document.write(ho + " " + ten);
      document.write(ho.length);
      document.write("<br>");
      // Kiem tra kieu du lieu cua bien
      document.write(ho.constructor);
      document.write("<br>");
      document.write(typeof ho);

      // Kiem tra vi tri bat dau
      document.write("<br>");
      var hoVaTen = "Duong Thanh";
      document.write(hoVaTen.indexOf("T"));
      document.write("<br>");
      document.write(hoVaTen.includes("c"));
      document.write("<br>");
      document.write(hoVaTen.startsWith("Thanh"));
      document.write(hoVaTen.includes("c"));
      document.write("<br>");
      // Thay the ky tu
      document.write(hoVaTen.replace("Thanh", "Duc"));
      document.write("<br>");
      // Thay the ky tu
      document.write(hoVaTen.toLowerCase());
      document.write("<br>");
      document.write(hoVaTen.toUpperCase());

      // Date
      var homNay = new Date();
      document.write("<br>");
      document.write(homNay);

      var ngay = new Date("9/30/2025");
      document.write("<br>");
      document.write(ngay);

      var namNay = homNay.getFullYear();
      document.write("<br>");
      document.write(namNay);

      var thangNay = homNay.getMonth();
      document.write("<br>");
      document.write(thangNay);
      thangNay;
      var thu = homNay.getDay();
      document.write("<br>");
      document.write(thu);

      var ngayHomNay = homNay.getDate();
      document.write("<br>");
      document.write(ngayHomNay);

      document.write("<br>");
      document.write(
        "Hom nay la thu " +
          ++thu +
          " ngay " +
          ngayHomNay +
          " thang " +
          ++thangNay +
          " nam " +
          namNay,
      );

      //   Mảng
      var mangSo = [1, 2, 3, 4, 5];
      document.write("<br>");
      document.write(mangSo[2]);
      document.write("<br>");
      document.write(mangSo.length);

      var mangChuoi = ["123", "456", "xyz"];
      document.write("<br>");
      document.write(mangChuoi[2]);

      var mang = [1, 2, 3, 4, 5, "123", "456", "abc"];
      document.write("<br>");
      document.write(mang[2]);

      var d = mang.concat(mangSo, mangChuoi);
      document.write("<br>");
      document.write(d);
      document.write("<br>");
      document.write(d.join("-"));
      document.write("<br>");
      document.write(d.pop());
      document.write("<br>");
      d.push("jqk");
      document.write(d);
      document.write("<br>");
      document.write(d.reverse());

      //   Object
      var thongTinSinhVien = {
        ten: "Abc",
        namSinh: 1900,
        gioiTinh: "Nam",
        queQuan: {
          thanhPho: "Ha Noi",
          phuong: "Tu Liem",
        },
      };
      document.write("<br>");
      document.write(
        thongTinSinhVien.ten,
        "<br>",
        thongTinSinhVien.queQuan.thanhPho,
      );

      tuoi = namNay - thongTinSinhVien.namSinh;
      document.write("<br>");
      document.write(tuoi);

      //   boolean: true nam / false nữ
      thongTinSinhVien.gioiTinh = true;

      var sinhVien = [
        {
          ten: "Abc",
          namSinh: 2003,
          gioiTinh: "Nam",
          queQuan: {
            thanhPho: "Ha Noi",
            phuong: "Tu Liem",
          },
        },

        {
          ten: "Xyz",
          namSinh: 2003,
          gioiTinh: "Nu",
          queQuan: {
            thanhPho: "Ha Noi",
            phuong: "Phu Dien",
          },
        },
      ];
      document.write("<br>");
      document.write(sinhVien[0].ten);

      //   ==  != > <
      //   === so sánh cả giá trị và kiểu dữ liệu
      var so1 = 5;
      var so2 = "10";
      document.write("<br>");
      document.write(so1 == so2);
      document.write("<br>");
      document.write(so1 != so2);
      document.write("<br>");
      document.write(so1 > so2);
      document.write("<br>");
      document.write(so1 === so2);
      document.write("<br>");

      if (thu >= 6) {
        document.write("Cuối tuần");
      } else if (thu == 5) {
        document.write("Sắp được ngủ");
      } else {
        document.write("Đi học");
      }

      document.write("<br>");

      // Kiểm tra số chẵn lẻ
      var so = 1200000000000000000001;
      if (so % 2 == 0) {
        document.write(so, " la so chan");
      } else {
        document.write(so, " la so le");
      }
    </script>

    <br />

    <!-- External JS -->
    <script src="./main.js"></script>
  </body>
</html>
