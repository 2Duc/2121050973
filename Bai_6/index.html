<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            p {
                color: blue;
            }
            p.nhom {
                color: red;
                background: black;
                text-align: center;
            }

            /* Grouping */
            h1,h2,h3 {
                background-color: beige;
            }

            .khoi1 {
                background-color: green;

            }
            .khoi2 {
                background-color: yellow;
                /* 1 giá trị: cách đều xung quanh = giá trị đó */
                /* 2 giá trị: giá trị đầu tiên (Trên dưới), giá trị 2 (trái, phải) */
                /* 4 giá trị: giá trị đầu tiên (trên), giá trị 2 (phải), giá trị 3 (dưới), giá trị 4 (trái) */
                /* margin: 50px 200px 10px 100px;  */
                width: 100px;
                margin: auto;  /*căn giữa*/
                /* 1 giá trị: cách đều xung quanh = giá trị đó */
                /* 2 giá trị: giá trị đầu tiên (Trên dưới), giá trị 2 (trái, phải) */
                /* 4 giá trị: giá trị đầu tiên (trên), giá trị 2 (phải), giá trị 3 (dưới), giá trị 4 (trái) */
                /* padding: 50px; */
            }
            .khoi3 {
                background-color: red;
            }

            .khoi4 {
                background-color: gray;
                display: flex;
            }

            .khoi5 {
                background-color: orange;
                width: 50%;
            }

            .khoi6 {
                background-color: antiquewhite;
                width: 50%;
            }
        </style>
    </head>
    <body>
        <p>Truong dai hoc mo dia chat</p>
        <p class="nhom">Nhóm 03</p>

        <!-- Grouping -->
        <h1>H1</h1>
        <h2>H2</h2>
        <h3>H3</h3>
        <!-- Contextual -->

        <!-- Pseudo Class, Pseudo Element -->


        <!-- margin padding -->

        <div class="khoi1">Khoi 1</div>
        <div class="khoi2">Khoi 2</div>
        <div class="khoi3">Khoi 3</div>

        <div class="khoi4">
            <div class="khoi5">Khoi 5</div>
            <div class="khoi6">Khoi 6 </div>
        </div>
    </body>
</html>
